name: CI

on:
  push:
    branches: [dev-meta, main]
    paths:
      - "minwm/**"
      - "tests/**"
      - "pyproject.toml"
      - ".flake8"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [dev-meta, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install lint tools
        run: pip install "black==26.5.1" "isort==8.0.1" "flake8==7.3.0"
      - name: black
        run: black --check minwm tests
      - name: isort
        run: isort --check-only minwm tests
      - name: flake8
        run: flake8 minwm tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # CPU-only torch from the official PyTorch index. The +cpu local-version
      # wheel only exists there, so PyPI (default index) is used for torch's
      # pure-python deps. Tests use basic tensor/nn APIs only; GPU cases are
      # gated behind @cuda_only and skip on CPU runners.
      - name: Install torch (CPU)
        run: pip install "torch==2.6.0+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install deps
        run: pip install "numpy>=1.26" "termcolor==3.3.0" "omegaconf==2.3.0" "pytest>=8.0" "einops==0.8.2" "diffusers==0.35.0" "scipy==1.15.3"
      - name: Install minwm (editable)
        run: pip install -e . --no-deps
      - name: pytest
        run: pytest tests/ -q --tb=short
